{{- if and .Values.migrate.enabled (not .Values.vault.enabled) -}}
{{/*
Hook-scoped copy of the main Secret. See configmap-migrate.yaml for why the
migrate Job needs its own copy.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terminus.fullname" . }}-migrate
  labels:
    {{- include "terminus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  DATABASE_URL: {{ include "terminus.databaseUrl" . | b64enc | quote }}
  KEYVALUE_URL: {{ include "terminus.keyvalueUrl" . | b64enc | quote }}
  APP_SECRET: {{ .Values.secrets.appSecret | b64enc | quote }}
{{- end }}
