{{- if not .Values.vault.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terminus.fullname" . }}
  labels:
    {{- include "terminus.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ include "terminus.databaseUrl" . | b64enc | quote }}
  KEYVALUE_URL: {{ include "terminus.keyvalueUrl" . | b64enc | quote }}
  APP_SECRET: {{ .Values.secrets.appSecret | b64enc | quote }}
{{- end }}
