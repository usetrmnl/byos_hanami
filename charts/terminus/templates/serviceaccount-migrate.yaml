{{- if and .Values.migrate.enabled .Values.vault.enabled .Values.vault.migrateInject -}}
{{/*
Hook-scoped ServiceAccount for the migrate Job's Vault Agent init container.
It cannot share a name with the release-managed ServiceAccount: Helm rejects a
hook-owned and a release-owned object sharing a name. This name must therefore
appear in the Vault Kubernetes auth role's bound_service_account_names.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terminus.fullname" . }}-migrate
  labels:
    {{- include "terminus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- include "terminus.stringMap" . | trim | nindent 4 }}
    {{- end }}
{{- end }}
