nl:
  date:
    formats:
      day_month_long: "%A, %B %-d"
  datetime:
    relative:
      distance_in_words:
        about_x_hours:
          one: ongeveer een uur
          other: ongeveer %{count} uur
        about_x_months:
          one: ongeveer een maand
          other: ongeveer %{count} maanden
        about_x_years:
          one: ongeveer een jaar
          other: ongeveer %{count} jaar
        almost_x_years:
          one: bijna een jaar
          other: bijna %{count} jaar
        half_a_minute: een halve minuut
        less_than_x_minutes:
          one: minder dan een minuut
          other: minder dan %{count} minuten
        less_than_x_seconds:
          one: minder dan een seconde
          other: minder dan %{count} seconden
        over_x_years:
          one: meer dan een jaar
          other: meer dan %{count} jaar
        x_days:
          one: "%{count} dag"
          other: "%{count} dagen"
        x_minutes:
          one: "%{count} minuut"
          other: "%{count} minuten"
        x_months:
          one: "%{count} maand"
          other: "%{count} maanden"
        x_seconds:
          one: "%{count} seconde"
          other: "%{count} seconden"
      future: over %{time}
      past: "%{time} geleden"
  time:
    formats:
      shorter: "%-H.%M"
    start_of_week: 1
