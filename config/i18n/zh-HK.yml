zh-HK:
  date:
    formats:
      day_month_long: "%A, %B %-d"
  datetime:
    relative:
      distance_in_words:
        about_x_hours:
          one: 約%{count}小時
          other: 約%{count}小時
        about_x_months:
          one: 約%{count}個月
          other: 約%{count}個月
        about_x_years:
          one: 約%{count}年
          other: 約%{count}年
        almost_x_years:
          one: 接近%{count}年
          other: 接近%{count}年
        half_a_minute: 半分鐘
        less_than_x_minutes:
          one: 不到%{count}分鐘
          other: 不到%{count}分鐘
        less_than_x_seconds:
          one: 不到%{count}秒
          other: 不到%{count}秒
        over_x_years:
          one: 超過%{count}年
          other: 超過%{count}年
        x_days:
          one: "%{count}天"
          other: "%{count}天"
        x_minutes:
          one: "%{count}分鐘"
          other: "%{count}分鐘"
        x_months:
          one: "%{count}個月"
          other: "%{count}個月"
        x_seconds:
          one: "%{count}秒"
          other: "%{count}秒"
      future: "%{time}後"
      past: "%{time}前"
  time:
    formats:
      shorter: "%-H:%M"
    start_of_week: 0
