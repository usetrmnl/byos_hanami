        less_than_x_minutes:
          one: פחות מדקה אחת
          other: פחות מ- %{count} דקות
          zero: פחות מדקה אחת
        less_than_x_seconds:
          one: פחות משניה אחת
          other: פחות מ- %{count} שניות
          zero: פחות משניה אחת
        over_x_years:
          one: מעל שנה אחת
          other: מעל %{count} שנים
        x_days:
          one: יום אחד
