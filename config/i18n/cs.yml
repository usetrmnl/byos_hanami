cs:
  date:
    formats:
      day_month_long: "%A %-d. %B"
  datetime:
    relative:
      distance_in_words:
        about_x_hours:
          one: asi %{count} hodina
          other: asi %{count} hodinami
        about_x_months:
          one: asi %{count} měsíc
          other: asi %{count} měsíci
        about_x_years:
          one: asi %{count} rok
          other: asi %{count} lety
        almost_x_years:
          one: téměř %{count} rok
          other: téměř %{count} lety
        half_a_minute: půl minutou
        less_than_x_minutes:
          one: méně než minutou
          other: méně než %{count} minutami
        less_than_x_seconds:
          one: méně než %{count} sekundou
          other: méně než %{count} sekundami
        over_x_years:
          one: více než %{count} rok
          other: více než %{count} lety
        x_days:
          one: "%{count} den"
          other: "%{count} dny"
        x_minutes:
          one: "%{count} minuta"
          other: "%{count} minutami"
        x_months:
          one: "%{count} měsíc"
          other: "%{count} měsíci"
        x_seconds:
          one: "%{count} sekunda"
          other: "%{count} sekundami"
      future: za %{time}
      past: před %{time}
  time:
    formats:
      shorter: "%-H:%M"
    start_of_week: 1
