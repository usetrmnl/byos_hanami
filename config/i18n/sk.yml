sk:
  date:
    formats:
      day_month_long: "%A, %B %-d"
  datetime:
    relative:
      distance_in_words:
        about_x_hours:
          one: asi hodinou
          other: asi %{count} hodinami
          few: asi %{count} hodinami
        about_x_months:
          one: asi mesiacom
          other: asi %{count} mesiacmi
          few: asi %{count} mesiacmi
        about_x_years:
          one: asi rokom
          other: asi %{count} rokmi
          few: asi %{count} rokmi
        almost_x_years:
          one: takmer rokom
          other: takmer %{count} rokmi
          few: takmer %{count} rokmi
        half_a_minute: pol minútou
        less_than_x_minutes:
          one: necelou minútou
          other: necelými %{count} minútami
          few: necelými %{count} minútami
        less_than_x_seconds:
          one: necelou sekundou
          other: necelými %{count} sekundami
          few: necelými %{count} sekundami
        over_x_years:
          one: viac ako rokom
          other: viac ako %{count} rokmi
          few: viac ako %{count} rokmi
        x_days:
          one: dňom
          other: "%{count} dňami"
          few: "%{count} dňami"
        x_minutes:
          one: minútou
          other: "%{count} minútami"
          few: "%{count} minútami"
        x_months:
          one: mesiacom
          other: "%{count} mesiacmi"
          few: "%{count} mesiacmi"
        x_seconds:
          one: sekundou
          other: "%{count} sekundami"
          few: "%{count} sekundami"
      future: in %{time}
      past: "%{time} ago"
  time:
    formats:
      shorter: "%-I:%M %p"
    start_of_week: 0
