zh-CN:
  date:
    formats:
      day_month_long: "%A, %B %-d"
  datetime:
    relative:
      distance_in_words:
        about_x_hours:
          one: 约 %{count} 小时
          other: 约 %{count} 小时
        about_x_months:
          one: 约 %{count} 个月
          other: 约 %{count} 个月
        about_x_years:
          one: 约 %{count} 年
          other: 约 %{count} 年
        almost_x_years:
          one: 不到 %{count} 年
          other: 不到 %{count} 年
        half_a_minute: 半分钟
        less_than_x_minutes:
          one: 不到 %{count} 分钟
          other: 不到 %{count} 分钟
        less_than_x_seconds:
          one: 不到 %{count} 秒
          other: 不到 %{count} 秒
        over_x_years:
          one: " %{count} 年多"
          other: " %{count} 年多"
        x_days:
          one: " %{count} 天"
          other: " %{count} 天"
        x_minutes:
          one: " %{count} 分钟"
          other: " %{count} 分钟"
        x_months:
          one: " %{count} 个月"
          other: " %{count} 个月"
        x_seconds:
          one: " %{count} 秒"
          other: " %{count} 秒"
      future: "%{time}后"
      past: "%{time}前"
  time:
    formats:
      shorter: "%-H:%M"
    start_of_week: 1
