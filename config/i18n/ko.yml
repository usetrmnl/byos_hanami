ko:
  date:
    formats:
      day_month_long: "%A, %B %-d"
  datetime:
    relative:
      distance_in_words:
        about_x_hours:
          one: 대략 %{count}시간
          other: 대략 %{count}시간
        about_x_months:
          one: 대략 %{count}개월
          other: 대략 %{count}개월
        about_x_years:
          one: 대략 %{count}년
          other: 대략 %{count}년
        almost_x_years:
          one: 거의 %{count}년
          other: 거의 %{count}년
        half_a_minute: 30초
        less_than_x_minutes:
          one: "%{count}분 미만"
          other: "%{count}분 미만"
        less_than_x_seconds:
          one: "%{count}초 미만"
          other: "%{count}초 미만"
        over_x_years:
          one: "%{count}년 초과"
          other: "%{count}년 초과"
        x_days:
          one: "%{count}일"
          other: "%{count}일"
        x_minutes:
          one: "%{count}분"
          other: "%{count}분"
        x_months:
          one: "%{count}개월"
          other: "%{count}개월"
        x_seconds:
          one: "%{count}초"
          other: "%{count}초"
      future: "%{time} 후"
      past: "%{time} 전"
  time:
    formats:
      shorter: "%-H:%M"
    start_of_week: 0
